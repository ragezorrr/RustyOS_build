[package]
name = "aqua"
version = "0.1.0"
edition = "2021"
description = "Aqua — a small macOS-styled Wayland compositor written in Rust"
license = "MIT"

[dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bitflags = "2"
tiny-skia = "0.12"
fontdue = "0.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[dependencies.smithay]
version = "0.7"
default-features = false
features = [
    "backend_winit",
    "wayland_frontend",
    "desktop",
]

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
